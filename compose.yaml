# Name of the Docker Compose project
name: deployment-test

# Define the containers/services that belong to this application
services:

  # NGINX REVERSE PROXY
  nginx:
    # Build the Nginx image using the root Dockerfile
    build:
      context: .
      dockerfile: Dockerfile

    # Tell Nginx where the frontend and backend are located
    environment:
      API_HOST: "api"
      WEB_HOST: "web"

    # Publish only Nginx to the host computer
    ports:
      - "127.0.0.1:8080:8080"

    # Start the backend and frontend before Nginx
    depends_on:
      - api
      - web

  # FRONTEND SERVICE
  web:
    build:
      context: ./client
      dockerfile: Dockerfile

    environment:
      PORT: "3000"

    # Make port 3000 available to other containers,
    # without publishing it to the host computer.
    expose:
      - "3000"

  # BACKEND SERVICE
  api:
    build:
      context: ./server
      dockerfile: Dockerfile

    environment:
      ASPNETCORE_HTTP_PORTS: "4000"

    # Make port 4000 available to other containers,
    # without publishing it to the host computer.
    expose:
      - "4000"

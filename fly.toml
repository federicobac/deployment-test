
# ------------------------------------------------------------
# FLY.IO APPLICATION CONFIGURATION
# ------------------------------------------------------------
# This file was generated by:
# fly launch --no-deploy
#
# It tells Fly.io how to deploy and run this application.
#
# Official documentation:
# https://fly.io/docs/reference/configuration/


# ------------------------------------------------------------
# APPLICATION IDENTITY
# ------------------------------------------------------------

# Unique name of the application registered on Fly.io.
# This is the name you see in your Fly.io dashboard.
app = 'deployment-test'

# Primary deployment region.
# 'arn' = Stockholm, Sweden.
# This determines the main geographical location of the app.
primary_region = 'arn'


# ------------------------------------------------------------
# HTTP SERVICE CONFIGURATION
# ------------------------------------------------------------

# Defines how Fly.io handles incoming HTTP requests.
[http_service]

  # Port inside the container where the application listens.
  # IMPORTANT: This must match the port used by your application.
  internal_port = 3000

  # Automatically redirect HTTP requests to HTTPS.
  # This enables secure connections to your public application.
  force_https = true

  # Automatically stop machines when they are not needed.
  # Helps reduce resource usage when the application is idle.
  auto_stop_machines = 'stop'

  # Automatically start machines when new requests arrive.
  # Works together with auto_stop_machines.
  auto_start_machines = true

  # Number of machines that should remain running when idle.
  # 0 means no machines need to remain running.
  min_machines_running = 0

  # Names the process group that handles this service.
  # 'app' is the default process group.
  processes = ['app']


# ------------------------------------------------------------
# VIRTUAL MACHINE CONFIGURATION
# ------------------------------------------------------------

# Defines the resources allocated to the application machine.
# The double brackets [[vm]] define a VM configuration entry.
[[vm]]

  # Use shared CPU resources instead of dedicated CPU resources.
  cpu_kind = "shared"

  # Allocate one virtual CPU.
  cpus = 1

  # Allocate 256 MB of RAM.
  # This matches the deployment assignment's requirements.
  memory = "256mb"
